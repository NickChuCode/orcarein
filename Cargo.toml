[workspace]
resolver = "2"
members = ["crates/orcarein-core", "crates/orcarein", "crates/orcarein-hardware"]

[workspace.package]
# Ch16: bumped to the MVP milestone version (tag `v0.1.0-mvp`).
version = "0.1.0"
authors = ["Yixinzhu@126.com"]
edition = "2021"
license = "MIT OR Apache-2.0"
# Ch17: real repository URL (was a placeholder before going public).
repository = "https://github.com/NickChuCode/orcarein"
rust-version = "1.85"

[workspace.dependencies]
# Pinned here when first introduced (see spec §5.5).
# Each member crate opts in with `<dep>.workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Ch05+Ch07: HTTP client. "json" + "stream" features.
reqwest = { version = "0.12", features = ["json", "stream"] }
# Ch06: line editor for the REPL (history, arrow keys, Ctrl+C/D handling).
rustyline = "14"
# Ch07: `StreamExt::next().await` for iterating a `Stream` of bytes.
futures-util = "0.3"
# Ch10: dev-dep in orcarein-core for the first tool integration test.
tempfile = "3"
# Ch13: `try_stream! { ... yield }` macro used by the provider impls.
async-stream = "0.3"
# Ch14: derive-based CLI parsing + subcommands (replaces the hand-written parser).
clap = { version = "4", features = ["derive"] }
# Ch14: cross-platform config / secrets directory resolution (XDG / %APPDATA%).
directories = "5"
# Ch14: TOML (de)serialization for config.toml and secrets.toml.
toml = "0.8"
# Ch16: structured diagnostic logging (quiet by default; opt in via RUST_LOG).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# v0.2 hardware wedge: Pi GPIO/I2C/SPI/UART. Linux-only; pulled in only behind
# the `hardware` feature + `target_os = "linux"` so non-Linux builds stay clean.
rppal = "0.18"
