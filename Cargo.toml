[workspace]
resolver = "2"
members = ["crates/orcarein-core", "crates/orcarein", "crates/orcarein-hardware", "crates/orcarein-eval"]

[workspace.package]
# Ch16: MVP `v0.1.0-mvp`. v0.2.0: terminal UX + session mgmt + cross-SoC hardware
# layer (board profiles + gpiocdev GPIO backend) — first packaged release with
# aarch64 Linux binaries for Pi / Orange Pi.
version = "0.2.0"
authors = ["Yixinzhu@126.com"]
edition = "2021"
license = "MIT OR Apache-2.0"
# Ch17: real repository URL (was a placeholder before going public).
repository = "https://github.com/NickChuCode/orcarein"
rust-version = "1.85"

[workspace.dependencies]
# Pinned here when first introduced (see spec §5.5).
# Each member crate opts in with `<dep>.workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Ch05+Ch07: HTTP client. "json" + "stream"; rustls (not the default OpenSSL)
# so cross-compiling to aarch64 Linux (Pi / Orange Pi) is painless and the
# binary carries bundled Mozilla roots — no system cert store needed on minimal
# SBC images. (v0.2 release packaging: see release.yml aarch64 targets.)
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "http2",
    "charset",
] }
# Ch06: line editor for the REPL (history, arrow keys, Ctrl+C/D handling).
rustyline = "14"
# Ch07: `StreamExt::next().await` for iterating a `Stream` of bytes.
futures-util = "0.3"
# Ch10: dev-dep in orcarein-core for the first tool integration test.
tempfile = "3"
# Ch13: `try_stream! { ... yield }` macro used by the provider impls.
async-stream = "0.3"
# Ch14: derive-based CLI parsing + subcommands (replaces the hand-written parser).
clap = { version = "4", features = ["derive"] }
# Ch14: cross-platform config / secrets directory resolution (XDG / %APPDATA%).
directories = "5"
# Ch14: TOML (de)serialization for config.toml and secrets.toml.
toml = "0.8"
# Ch16: structured diagnostic logging (quiet by default; opt in via RUST_LOG).
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# v0.2 hardware wedge (M2): cross-SoC GPIO via the Linux character device.
# SoC-agnostic (drives Broadcom Pi + Rockchip Orange Pi through the kernel cdev
# ABI), pure Rust, MSRV 1.68. Linux-only; pulled in only behind the `hardware`
# feature + `target_os = "linux"` so non-Linux builds stay clean. Replaces the
# retired, Broadcom-only `rppal` (see the M2/M3 revised spec).
gpiocdev = "0.8"
# v0.2 terminal UX: TUI overlay (pager + future GPIO monitor). crossterm is used
# via `ratatui::crossterm`. Binary-only, behind the `tui` feature.
ratatui = "0.29"
# v0.2 research track: CSV export for the eval harness (orcarein-eval only).
# Eval-only; core/bin never depend on it, so it can't reach a published crate.
csv = "1"
