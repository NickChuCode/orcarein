[workspace]
resolver = "2"
members = ["crates/orcarein-core", "crates/orcarein"]

[workspace.package]
version = "0.0.0"
# TODO(Ch17): replace placeholder before pushing to crates.io in Ch21
authors = ["Yixinzhu@126.com"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<user>/orcarein"
rust-version = "1.85"

[workspace.dependencies]
# Pinned here when first introduced (see spec §5.5).
# Each member crate opts in with `<dep>.workspace = true`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# Ch05+Ch07: HTTP client. "json" + "stream" features.
reqwest = { version = "0.12", features = ["json", "stream"] }
# Ch06: line editor for the REPL (history, arrow keys, Ctrl+C/D handling).
rustyline = "14"
# Ch07: `StreamExt::next().await` for iterating a `Stream` of bytes.
futures-util = "0.3"
# Ch10: dev-dep in orcarein-core for the first tool integration test.
tempfile = "3"
# Ch13: `try_stream! { ... yield }` macro used by the provider impls.
async-stream = "0.3"
