# release-plz configuration.
#
# Ch19: release-plz only maintains the "Release PR" (updates CHANGELOG.md and
# bumps the workspace version) — it does NOT tag, create GitHub releases, or
# publish to crates.io yet. The workflow runs `command: release-pr` only.
#
# Ch20/21 will wire up the `release` command (git tag + GitHub release) and
# crates.io publishing (CARGO_REGISTRY_TOKEN).

[workspace]
# Keep CHANGELOG.md in sync from Conventional Commits.
changelog_update = true
# This is a single-version workspace (`version.workspace = true` in both crates),
# so release-plz bumps `[workspace.package].version` in the root Cargo.toml plus
# Cargo.lock. git release / crates.io publish stay off until Ch20/21.
git_release_enable = false
publish = false
