[package]
name = "orcarein-core"
description = "Core library for OrcaRein agent harness"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Ch05: serde derive for message (de)serialization.
serde = { workspace = true }
# Ch09: tool::ToolSchema is `serde_json::Value` and FunctionCall::parse_arguments
# returns `serde_json::Error` — both in the public API.
serde_json = { workspace = true }
# Ch10: `trait Tool::execute` is async — async_trait erases the future.
async-trait = { workspace = true }
# Ch10: `ToolError` is thiserror-derived so callers can match on variants.
thiserror = { workspace = true }
# Ch10: `ReadFileTool::execute` uses `tokio::fs::read_to_string`.
tokio = { workspace = true }
# Ch13: trait Provider returns `anyhow::Result<BoxStream<...>>`.
anyhow = { workspace = true }
# Ch13: HTTP + SSE for the DeepSeek / OpenAI providers (moved from the binary).
reqwest = { workspace = true }
# Ch13: BoxStream type + StreamExt for iterating SSE chunks.
futures-util = { workspace = true }
# Ch13: `try_stream! { ... yield }` macro lets the provider impls write
# their SSE loop linearly.
async-stream = { workspace = true }

[dev-dependencies]
# Ch10: integration test for ReadFileTool needs scratch files.
tempfile = { workspace = true }
