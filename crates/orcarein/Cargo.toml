[package]
name = "orcarein"
description = "OrcaRein CLI — an open-source agent harness for DeepSeek V4 and OpenAI-compatible models"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "deepseek", "cli", "harness"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orcarein"
path = "src/main.rs"

[dependencies]
# Path for local builds; `version` is required so the crate can be published to crates.io.
orcarein-core = { path = "../orcarein-core", version = "0.3.0" }
# Ch05: anyhow::Result for the binary's main + run_turn surface.
anyhow = { workspace = true }
# Ch05: async runtime hosting the REPL and `provider.chat_stream` futures.
tokio = { workspace = true }
# Ch06: REPL line editor.
rustyline = { workspace = true }
# Ch13: iterate `BoxStream<StreamEvent>` from the Provider trait.
futures-util = { workspace = true }
# Ch14: derive-based CLI parsing — `Parser`, subcommands, `--flags`.
clap = { workspace = true }
# v02-22: home-dir resolution for abbreviate_home (~ collapse in the header).
directories = { workspace = true }
# Ch16: diagnostic logging facade + a stderr subscriber driven by RUST_LOG.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# v0.2 terminal UX: alt-screen overlay/pager (crossterm via `ratatui::crossterm`).
# Optional + behind the `tui` feature (default-on). `--no-default-features`
# drops it for a lean headless build; pager then degrades to plain printing.
ratatui = { workspace = true, optional = true }
# v02-22 TUI 头部：显示宽度计算（CJK 全角=2），CJK 路径/标题对齐。
unicode-width = { workspace = true }
# v02-25 分页器 markdown 渲染：CommonMark 解析器。optional + 并入 `tui` feature。
pulldown-cmark = { workspace = true, optional = true }
# v02-35 permission v2: scope_key/persist_bash_rule parse tool-call args JSON.
serde_json = { workspace = true }

[features]
default = ["tui", "mcp"]
# Compile the alt-screen overlay (pager now; GPIO live monitor later). At
# runtime the overlay is still capability-gated (non-tty / TERM=dumb / serial /
# headless → plain print), so this only controls whether the code is built in.
tui = ["dep:ratatui", "dep:pulldown-cmark"]
# Enable the hand-rolled MCP client and register MCP-server tools at session
# startup. Default-on so that a config.toml [mcp_servers] block is picked up
# out of the box. Turn off with --no-default-features for a lean headless build
# that has no MCP overhead.
mcp = ["orcarein-core/mcp"]
# Compile the `orcarein hw` subcommand (GPIO live monitor). OFF by default: the
# hardware wedge is experimental and orcarein-hardware isn't on crates.io yet,
# so the published binary stays clean of a hardware command. Pure cfg flag for
# now (the monitor reads through the bin-local `GpioSource` with a demo backend);
# when orcarein-hardware ships, this feature will also pull it in for the real
# pin-reading adapter. Build/run with `--features hardware`.
hardware = []

[dev-dependencies]
# v02-20: scratch dirs for project-memory injection tests.
tempfile = { workspace = true }
