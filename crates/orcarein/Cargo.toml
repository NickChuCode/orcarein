[package]
name = "orcarein"
description = "OrcaRein CLI — an open-source agent harness for DeepSeek V4 and OpenAI-compatible models"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["agent", "llm", "deepseek", "cli", "harness"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orcarein"
path = "src/main.rs"

[dependencies]
# Path for local builds; `version` is required so the crate can be published to crates.io.
orcarein-core = { path = "../orcarein-core", version = "0.1.0" }
# Ch05: anyhow::Result for the binary's main + run_turn surface.
anyhow = { workspace = true }
# Ch05: async runtime hosting the REPL and `provider.chat_stream` futures.
tokio = { workspace = true }
# Ch06: REPL line editor.
rustyline = { workspace = true }
# Ch13: iterate `BoxStream<StreamEvent>` from the Provider trait.
futures-util = { workspace = true }
# Ch14: derive-based CLI parsing — `Parser`, subcommands, `--flags`.
clap = { workspace = true }
# Ch16: diagnostic logging facade + a stderr subscriber driven by RUST_LOG.
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
