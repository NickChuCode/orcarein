# Board GPIO profile — Orange Pi 5 Plus (Rockchip RK3588).
#
# Pinout transcribed from the official "OrangePi 5 Plus RK3588 User Manual"
# v1.5.1 (Xunlong), 40-pin diagram. RK3588 GPIO is banked: 5 banks GPIO0..GPIO4
# of 32 lines, each its own gpiochip; a pin label `GPIO{bank}_{port}{index}`
# (ports A-D = 0-3) maps to cdev chip=bank, offset=port*8+index. Keys are
# physical header pins; power/ground omitted.
#
# NOTE — pins 8 and 10 are intentionally omitted: the v1.5.1 manual's printed
# labels (GPIO1_A1 / GPIO1_A0) conflict with its own wPi numbers (109 / 110,
# which compute to GPIO3_B5 / GPIO3_B6). Rather than ship a guess, verify on the
# board with `gpio readall` / `gpioinfo` and add them.
#
# NOTE — the RK3588 5 Plus and 5 Max have DIFFERENT pinouts; do not interchange.
# gpiochip enumeration is not guaranteed to equal bank order, so the I/O layer
# resolves each bank's chip by label at runtime.
schema_version = 1

[board]
name = "orangepi5plus"

[[pin]]
name = "pin3"
line = "GPIO0_C0"   # wPi 16 · I2C2_M0 SDA
[[pin]]
name = "pin5"
line = "GPIO0_B7"   # wPi 15 · I2C2_M0 SCL
[[pin]]
name = "pin7"
line = "GPIO1_D6"   # wPi 62
