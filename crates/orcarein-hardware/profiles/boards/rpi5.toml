# Board GPIO profile — Raspberry Pi 5 (BCM2712 + RP1 southbridge).
#
# Pi 5 moved user GPIO behind RP1; on current Raspberry Pi OS the user-facing
# chip is labelled `pinctrl-rp1` (it sits on gpiochip0 now, gpiochip4 on older
# images — which is exactly why we resolve by LABEL, not number). The 40-pin
# pinout (and thus offsets) matches the Pi 4. Pin assignments are EXAMPLES —
# verify with `gpioinfo` on the board.
schema_version = 1

[board]
name = "rpi5"
gpiochip_labels = ["pinctrl-rp1"]

[[pin]]
name = "LED"
offset = 17   # BCM17, physical pin 11

[[pin]]
name = "BUTTON"
offset = 27   # BCM27, physical pin 13
