# Board GPIO profile — Orange Pi 5 Max (Rockchip RK3588).
#
# Pinout transcribed from the official "OrangePi 5 Max RK3588 User Manual" v1.2
# (Xunlong), 40-pin diagram. Same RK3588 banked GPIO as the 5 Plus (5 banks of
# 32, label `GPIO{bank}_{port}{index}` → chip=bank, offset=port*8+index), but the
# 5 Max's 40-pin pinout DIFFERS from the 5 Plus — several pins map to different
# lines, and the 5 Max breaks out bank-4 lines (GPIO4_A6/A7). This table is the
# 5 Max's own; do not interchange with the 5 Plus.
#
# Every pin here is internally consistent (label ↔ wPi via the formula). Keys are
# physical header pins; power/ground omitted. gpiochip enumeration is not
# guaranteed to equal bank order, so the I/O layer resolves each bank's chip by
# label at runtime. Cheapest final confirmation: `gpio readall` on the board.
schema_version = 1

[board]
name = "orangepi5max"

[[pin]]
name = "pin3"
line = "GPIO0_C0"   # wPi 16 · I2C2_M0 SDA
[[pin]]
name = "pin5"
line = "GPIO0_B7"   # wPi 15 · I2C2_M0 SCL
[[pin]]
name = "pin7"
line = "GPIO1_A7"   # wPi 39
[[pin]]
name = "pin8"
line = "GPIO0_B5"   # wPi 13 · UART TXD
